name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build src/Emby.GPodderSync.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: Emby.GPodderSync
          path: src/bin/Release/netstandard2.0/Emby.GPodderSync.dll
      - name: Attach the DLL to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/bin/Release/netstandard2.0/Emby.GPodderSync.dll
