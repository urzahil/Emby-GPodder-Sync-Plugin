name: build

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # The tag is the version, so the DLL never carries a stale number from the csproj.
            dotnet build src/Emby.GPodderSync.csproj -c Release -p:Version="$GITHUB_REF_NAME"
          else
            dotnet build src/Emby.GPodderSync.csproj -c Release
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Emby.GPodderSync
          path: src/bin/Release/netstandard2.0/Emby.GPodderSync.dll

  release:
    # Only tag builds (x.y.z) publish a release, and only this job may write to the repository.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Emby.GPodderSync
      - name: Attach the DLL to the release
        uses: softprops/action-gh-release@v2
        with:
          files: Emby.GPodderSync.dll
